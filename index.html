<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Checklist — no npm</title>
  <style>
    :root {
      --bg-1: #0f2d44;
      --bg-2: #1a5674;
      --card: rgba(255,255,255,.84);
      --ink: #12212e;
      --muted: #5e6a75;
      --accent: #111827;
      --line: #d7dee5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #5083b8 0%, var(--bg-2) 36%, var(--bg-1) 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    .app {
      width: min(460px, 100%);
      margin: 0 auto;
      padding: 18px 14px 96px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,.15);
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title { color:#fff; text-align:center; margin-bottom:10px; }
    .title h1 { margin:0; font-size:16px; font-weight:700; }
    .title p { margin:2px 0 0; font-size:12px; opacity:.9; }
    .steps { font-size:12px; color: var(--muted); }
    .seg { display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; }
    .btn {
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      font-weight:600;
    }
    .btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-ghost { background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; }
    .controls { display:flex; gap:8px; align-items:center; }
    input[type="text"] {
      width:100%; border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:14px;
    }
    .pill { border-radius:999px; border:1px solid var(--line); background:#eef2f6; padding:6px 10px; font-size:12px; cursor:pointer; }
    .pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .progress {
      height:8px; border-radius:999px; background:#e6ebf0; overflow:hidden; margin-top:8px;
    }
    .progress > div { height:100%; background:var(--accent); width:0; transition:width .2s; }
    .group-title { font-size:12px; color:#fff; margin:12px 2px 6px; display:flex; justify-content:space-between; }
    .item {
      background:#fff; border:1px solid #dfe5eb; border-radius:14px; padding:10px; margin-bottom:8px; cursor:pointer;
      display:flex; gap:10px; align-items:flex-start;
    }
    .check {
      width:20px; height:20px; border-radius:50%; border:2px solid #c6ced6; margin-top:1px; flex: 0 0 20px;
    }
    .item.done .check { background:var(--accent); border-color:var(--accent); }
    .item.done .name { text-decoration: line-through; color:#7a8793; }
    .name { font-size:14px; font-weight:600; }
    .meta { font-size:11px; color:#66727d; margin-top:3px; }
    .nav {
      position:fixed; left:0; right:0; bottom:0; padding:10px; display:flex; justify-content:center;
    }
    .nav-inner {
      width:min(460px,100%); display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.45); border-radius:18px; padding:8px;
      backdrop-filter: blur(8px);
    }
    .small { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
<div class="app">
  <div class="title">
    <h1>Travel Checklist</h1>
    <p>Нативная версия без npm</p>
  </div>

  <section id="wizard" class="view"></section>
  <section id="checklist" class="view" hidden></section>
  <section id="history" class="view" hidden></section>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="btn" data-tab="wizard">План</button>
    <button class="btn" data-tab="checklist">Сборы</button>
    <button class="btn" data-tab="history">История</button>
  </div>
</nav>

<script>
const CREW = [
  { id: 'lera', label: 'Лера' },
  { id: 'ilya', label: 'Илья' },
  { id: 'both', label: 'Лера + Илья' }
];
const MODES = [
  { id: 'sea_summer', title: 'Лето · Море' },
  { id: 'weekend_summer', title: 'Лето · Уикенд' },
  { id: 'weekend_winter', title: 'Зима · Уикенд' },
  { id: 'ski_winter', title: 'Зима · Лыжи' },
  { id: 'biz_summer', title: 'Командировка · Лето' },
  { id: 'biz_winter', title: 'Командировка · Зима' }
];
const MODE_TEMPLATE_MAP = {
  sea_summer: 'sea_summer', weekend_summer: 'sea_summer', biz_summer: 'sea_summer',
  weekend_winter: 'ski_winter', ski_winter: 'ski_winter', biz_winter: 'ski_winter'
};
const TEMPLATE = {
  sea_summer: {
    common: { 'Документы': ['Паспорт', 'Бронь'], 'Электроника': ['Телефон', 'Зарядка'], 'Здоровье': ['Аптечка'] },
    lera: { 'Одежда': ['Купальник', 'Сандалии'] },
    ilya: { 'Одежда': ['Футболки', 'Кроссовки'] }
  },
  ski_winter: {
    common: { 'Документы': ['Паспорт', 'Страховка'], 'Экипировка': ['Шлем', 'Маска'], 'Здоровье': ['Аптечка'] },
    lera: { 'Одежда': ['Тёплая куртка', 'Шапка'] },
    ilya: { 'Одежда': ['Тёплая куртка', 'Термобельё'] }
  }
};
const HISTORY = [
  { label:'Зима · Лыжи · Лера + Илья', mode:'ski_winter', crew:'both' },
  { label:'Лето · Море · Лера + Илья', mode:'sea_summer', crew:'both' },
  { label:'Командировка · Зима · Илья', mode:'biz_winter', crew:'ilya' }
];

const state = {
  tab: 'wizard', step: 1, crew: 'both', mode: 'sea_summer', days: 7,
  search: '', onlyCritical: false, blocks: []
};

function makeBlocks(mode, crew) {
  const tpl = TEMPLATE[MODE_TEMPLATE_MAP[mode] || 'sea_summer'];
  const blocks = [];
  const push = (owner, category, items) => {
    blocks.push({ owner, category, items: items.map(name => ({ id: owner+category+name, name, done:false, critical: owner==='common' })) });
  };
  Object.entries(tpl.common || {}).forEach(([c, arr]) => push('common', c, arr));
  if (crew === 'ilya' || crew === 'both') Object.entries(tpl.ilya || {}).forEach(([c, arr]) => push('ilya', c, arr));
  if (crew === 'lera' || crew === 'both') Object.entries(tpl.lera || {}).forEach(([c, arr]) => push('lera', c, arr));
  return blocks;
}

function openTab(tab) {
  state.tab = tab;
  for (const el of document.querySelectorAll('.view')) el.hidden = el.id !== tab;
  for (const btn of document.querySelectorAll('[data-tab]')) btn.classList.toggle('active', btn.dataset.tab === tab);
  render();
}

function renderWizard() {
  const root = document.getElementById('wizard');
  root.innerHTML = `
    <div class="card">
      <div class="row steps"><strong>Шаг ${state.step} из 3</strong><button class="btn" id="nextStep">Далее</button></div>
      ${state.step===1 ? `<div><p class="small">Кто едет?</p><div class="seg">${CREW.map(c=>`<button class="btn ${state.crew===c.id?'active':''}" data-crew="${c.id}">${c.label}</button>`).join('')}</div></div>`:''}
      ${state.step===2 ? `<div><p class="small">Сценарий поездки</p><div class="seg">${MODES.map(m=>`<button class="btn ${state.mode===m.id?'active':''}" data-mode="${m.id}">${m.title}</button>`).join('')}</div></div>`:''}
      ${state.step===3 ? `<div><p class="small">Длительность</p><div class="controls"><button class="btn" id="minus">-</button><div class="btn" style="flex:1;text-align:center">${state.days} дней</div><button class="btn" id="plus">+</button></div></div>`:''}
    </div>
    <div class="card">
      <p class="small">${CREW.find(c=>c.id===state.crew).label} · ${MODES.find(m=>m.id===state.mode).title} · ${state.days} дней</p>
      <button class="btn active" id="start">Сформировать список</button>
    </div>`;

  root.querySelector('#nextStep').onclick = () => { state.step = state.step === 3 ? 1 : state.step + 1; renderWizard(); };
  root.querySelector('#start').onclick = () => { state.blocks = makeBlocks(state.mode, state.crew); openTab('checklist'); };
  root.querySelectorAll('[data-crew]').forEach(b => b.onclick = () => { state.crew = b.dataset.crew; renderWizard(); });
  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderWizard(); });
  const minus = root.querySelector('#minus'); if (minus) minus.onclick = () => { state.days = Math.max(1, state.days - 1); renderWizard(); };
  const plus = root.querySelector('#plus'); if (plus) plus.onclick = () => { state.days = Math.min(45, state.days + 1); renderWizard(); };
}

function renderChecklist() {
  const root = document.getElementById('checklist');
  const flat = state.blocks.flatMap(b => b.items);
  const done = flat.filter(i=>i.done).length;
  const p = flat.length ? Math.round(done * 100 / flat.length) : 0;

  const filtered = state.blocks.map(b => ({...b, items: b.items.filter(i => (!state.onlyCritical || i.critical) && i.name.toLowerCase().includes(state.search.toLowerCase()))})).filter(b => b.items.length);

  root.innerHTML = `
    <div class="card">
      <div class="small">Готово ${done} из ${flat.length} · ${p}%</div>
      <div class="progress"><div style="width:${p}%"></div></div>
      <div style="margin-top:8px"><input type="text" id="search" placeholder="Поиск вещи" value="${state.search.replace(/"/g,'&quot;')}"></div>
      <button class="pill ${state.onlyCritical?'active':''}" id="critical">${state.onlyCritical ? 'Показывать всё' : 'Только важное'}</button>
    </div>
    ${filtered.map(group=>`
      <div class="group-title"><span>${group.owner} · ${group.category}</span><span>${group.items.filter(i=>i.done).length}/${group.items.length}</span></div>
      ${group.items.map(i=>`<div class="item ${i.done?'done':''}" data-item="${i.id}"><div class="check"></div><div><div class="name">${i.name}</div><div class="meta">${i.critical?'важно':'комфорт'}</div></div></div>`).join('')}
    `).join('')}
  `;

  root.querySelector('#search').oninput = e => { state.search = e.target.value; renderChecklist(); };
  root.querySelector('#critical').onclick = () => { state.onlyCritical = !state.onlyCritical; renderChecklist(); };
  root.querySelectorAll('[data-item]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.item;
      state.blocks = state.blocks.map(b => ({ ...b, items: b.items.map(i => i.id === id ? ({...i, done: !i.done}) : i) }));
      renderChecklist();
    };
  });
}

function renderHistory() {
  const root = document.getElementById('history');
  root.innerHTML = HISTORY.map((h, idx) => `
    <div class="card">
      <div class="row"><div><div><strong>${h.label}</strong></div><div class="small">Открыть как новый план</div></div><button class="btn" data-h="${idx}">Открыть</button></div>
    </div>
  `).join('');
  root.querySelectorAll('[data-h]').forEach(b => {
    b.onclick = () => {
      const h = HISTORY[Number(b.dataset.h)];
      state.mode = h.mode; state.crew = h.crew; state.blocks = makeBlocks(h.mode, h.crew);
      openTab('checklist');
    };
  });
}

function render() {
  renderWizard();
  renderChecklist();
  renderHistory();
}

document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => openTab(btn.dataset.tab));
state.blocks = makeBlocks(state.mode, state.crew);
openTab('wizard');
</script>
</body>
</html>
